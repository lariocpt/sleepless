[package]
name = "sleepless"
version = "0.1.3"
edition = "2024"
# 1.89 comes from starship-battery (macOS/Windows only); ratatui needs 1.88 and
# is the Linux ceiling. Declared as one number because Cargo has no per-target MSRV.
rust-version = "1.89"
description = "Keep your computer awake while this runs in a terminal — I CAN'T GET NO SLEEP"
license = "MIT"
repository = "https://github.com/lariocpt/sleepless"
homepage = "https://github.com/lariocpt/sleepless"
readme = "README.md"
keywords = ["tui", "sleep", "caffeine", "power", "terminal"]
categories = ["command-line-utilities"]
exclude = ["/.github", "/.claude", "/CLAUDE.md", "/docs"]

[dependencies]
ratatui = "0.30"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1.1"

# SIGTERM/SIGINT handling is wanted on every Unix, not just Linux: without it macOS
# dies inside the alternate screen with raw mode still on.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
ksni = { version = "0.3.6", features = ["blocking"], optional = true }

# macOS/Windows go through keepawake, which wraps IOPMAssertionCreateWithName and
# SetThreadExecutionState respectively — both process-scoped, so the core guarantee holds.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keepawake = "0.6"
starship-battery = "0.11"

[features]
default = ["tray"]
tray = ["dep:ksni"]

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# Note: nothing in a release binary may depend on where it was built, or a published
# archive could never be compared against a rebuild of its own tag. `trim-paths` is
# the eventual home for that and is still unstable, so tools/package.py passes
# --remap-path-prefix instead. Keep the two in step if this is ever uncommented.
# trim-paths = "all"
