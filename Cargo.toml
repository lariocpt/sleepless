[package]
name = "nosleep"
version = "0.1.0"
edition = "2024"
description = "Keep your computer awake while this runs in a terminal — I CAN'T GET NO SLEEP"
license = "MIT"

[dependencies]
ratatui = "0.30"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
ksni = { version = "0.3.6", features = ["blocking"], optional = true }
signal-hook = "0.4"

# Untested fallback backends; the Linux path talks D-Bus directly (see src/inhibit.rs)
[target.'cfg(not(target_os = "linux"))'.dependencies]
keepawake = "0.6"
starship-battery = "0.11"

[features]
default = ["tray"]
tray = ["dep:ksni"]

[dev-dependencies]
tempfile = "3"
