name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this, so the gate in front of a tag is literally this file
  # rather than a copy of it that can drift. A tag push triggers neither of the
  # events above, so without this the one path to the public would be the one path
  # with no tests in front of it.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on a pull request, never on main: two quick merges would
  # otherwise leave the first commit with no completed gate at all, and main is the
  # branch every release is cut from.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The checks that need no compiler, and the ones that keep the prose honest.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install deps
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck dash

      - name: Shell scripts parse and lint
        shell: bash
        run: |
          set -euo pipefail
          # test/smoke.sh says #!/bin/sh, so it has to mean it: bash-in-disguise is
          # how a script that works on a developer's box dies on a minimal host.
          for f in test/*.sh; do
            sh -n "$f"
            dash -n "$f"
            shellcheck -s sh "$f"
          done
          for f in tools/*.sh; do
            bash -n "$f"
            shellcheck -s bash "$f"
          done

      - name: Python tools compile, and their guards work
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q tools
          # The Windows reproducibility guard, exercised without a Windows build:
          # getting its rule wrong is silent in both directions -- too strict and
          # every Windows release fails, too loose and it stops meaning anything.
          tools/package.py --self-test

      # actionlint also shellchecks the embedded `run:` blocks, which is where the
      # bugs in this repo's workflows actually lived. Pinned, not `latest`: a linter
      # that changes under you turns a green branch red with no commit.
      - name: Lint the workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      # And the properties they are supposed to have, each one written down because
      # it was once wrong and nothing could notice.
      - name: Workflow invariants
        shell: bash
        run: |
          set -euo pipefail
          tools/check-workflows.py

      - name: The website is self-contained and its font is the program's
        shell: bash
        run: |
          set -euo pipefail
          tools/check-site.py docs/index.html
          tools/gen-site-font.py --check

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
        with: { components: rustfmt }
      - shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check

  # Compile every target we ship, including the ones with no runner. `cargo clippy`
  # does not link, so this needs no cross-linker and no C toolchain -- the whole
  # dependency tree is pure Rust, with no build scripts.
  lint:
    name: clippy ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - x86_64-apple-darwin
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
        with:
          components: clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # The target arrives through the environment, not spliced into the script.
      # A `${{ }}` inside a run block is substituted before any shell sees it, so it
      # is a string-concatenation hole rather than a variable -- the same shape as
      # interpolating into a shell command anywhere else.
      - shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo clippy --locked --target "$TARGET" --all-targets -- -D warnings
          # The tray is a default feature but Linux-only; a no-tray build has to stay
          # clean too, since that is how a minimal package gets built.
          cargo clippy --locked --target "$TARGET" \
            --no-default-features --all-targets -- -D warnings

  # MSRV is 1.89, forced by starship-battery on macOS and Windows. ratatui needs 1.88
  # and is the Linux ceiling. Cargo has no per-target rust-version, so we declare the
  # higher one and check it on every OS that pulls that dependency -- Windows was
  # missing from this list while the comment named it.
  msrv:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
        with: { toolchain: '1.89.0' }
      - uses: Swatinem/rust-cache@v2
      - shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --all-targets

  test:
    name: test ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # arm64 is here rather than in a job of its own, so it runs the same platform
        # probe as x86-64 instead of only `cargo test`. GitHub's arm runners are free
        # for public repositories.
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
          - ubuntu-24.04-arm
          - windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust
      - uses: Swatinem/rust-cache@v2

      # dbus-daemon is what the lock-liveness test needs. Without it that one test
      # announces a SKIP rather than failing, so install it where we can and let the
      # skip cover the rest.
      - name: Install dbus
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dbus

      - shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --all-targets
          cargo test --locked --no-default-features --lib
          cargo build --locked

      # A green compile proves nothing about whether the lock is real. Ask the
      # platform itself. Both scripts are real files so shellcheck sees them and so
      # they can be run by hand.
      - name: Platform smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          test/smoke.sh target/debug/sleepless | tee smoke.log
          # The verdict, not just the exit status: a script that returns early before
          # its own last line still exits 0, and a skipped layer must not look like a
          # completed run.
          grep -qx 'smoke: ok' smoke.log \
            || { echo "::error::the smoke script did not reach its verdict"; exit 1; }

      - name: Platform smoke test
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh test/smoke.ps1 .\target\debug\sleepless.exe

      # The archive the release publishes must not depend on the machine that built
      # it. Two builds here, compared -- the release workflow repeats it against the
      # published bytes.
      - name: The archive reproduces
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          target=$(rustc -vV | sed -n 's/^host: //p')
          rustup target add "$target"
          ( umask 022; tools/package.py --target "$target" --out dist-a )
          ( umask 077; tools/package.py --target "$target" --out dist-b )
          a=$(cut -d' ' -f1 dist-a/*.sha256)
          b=$(cut -d' ' -f1 dist-b/*.sha256)
          [ "$a" = "$b" ] || { echo "::error::the archive is not reproducible: $a vs $b"; exit 1; }
          ( cd dist-a && sha256sum -c ./*.sha256 )
          echo "reproducible: $a"
